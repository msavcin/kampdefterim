<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Şifre Sıfırlama - Kamp Defterim</title>
  <link rel="icon" href="../assets/images/icon.png">
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f8fafc; color: #222; margin: 0; }
    .container { max-width: 400px; margin: 40px auto; background: #fff; border-radius: 16px; box-shadow: 0 2px 12px #0001; padding: 32px; }
    .logo { width: 100px; display: block; margin: 0 auto 24px; border-radius: 24px; background: #f8fafc; }
    h1 { text-align: center; color: #0e7490; margin-bottom: 8px; }
    .info { margin: 24px 0; text-align: center; }
    .footer { text-align: center; color: #94a3b8; font-size: 0.95em; margin-top: 32px; }
    .hidden { display: none; }
    .form-group { margin-bottom: 18px; }
    label { display: block; margin-bottom: 6px; color: #64748b; }
    input[type="password"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 1em; }
    button { width: 100%; background: linear-gradient(90deg, #0ea5e9 0%, #0e7490 100%); color: #fff; font-size: 1.1em; font-weight: 600; padding: 12px 0; border: none; border-radius: 32px; cursor: pointer; margin-top: 8px; }
    button:disabled { background: #94a3b8; cursor: not-allowed; }
    .msg { text-align: center; margin: 18px 0; color: #0e7490; font-weight: 500; }
    .error { color: #dc2626; }
  </style>
</head>
<body>
  <div class="container">
    <img src="../assets/images/login_screen.png" alt="Kamp Defterim Logo" class="logo">
    <h1>Şifre Sıfırlama</h1>
    <div id="msg" class="msg"></div>
    <form id="resetForm" class="hidden">
      <div class="form-group">
        <label for="password">Yeni Şifre</label>
        <input type="password" id="password" minlength="6" required autocomplete="new-password" />
      </div>
      <div class="form-group">
        <label for="password2">Yeni Şifre (Tekrar)</label>
        <input type="password" id="password2" minlength="6" required autocomplete="new-password" />
      </div>
      <button type="submit" id="submitBtn">Şifreyi Sıfırla</button>
    </form>
    <div class="footer">
      &copy; 2025 Kamp Defterim
    </div>
  </div>
  <script>
    const msg = document.getElementById('msg');
    const form = document.getElementById('resetForm');
    const submitBtn = document.getElementById('submitBtn');
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    let deepLinkTried = false;

    if (token) {
      // Deep link ile uygulamayı açmayı dene
      window.location.href = `kampdefterim://reset-password?token=${token}`;
      deepLinkTried = true;
      // 2 saniye sonra hala web'deyse, formu göster
      setTimeout(() => {
        if (deepLinkTried) {
          msg.innerHTML = 'Uygulama açılamadıysa, buradan web üzerinden şifrenizi sıfırlayabilirsiniz.';
          form.classList.remove('hidden');
        }
      }, 2000);
    } else {
      msg.innerHTML = '<span class="error">Geçersiz veya eksik bağlantı.</span>';
    }

    // Sunucu saatini alıp offset hesapla
    let serverOffset = 0;
    async function getServerOffset() {
      try {
        const res = await fetch('https://botanikakademi.com/node/server-time');
        const data = await res.json();
        const serverTime = new Date(data.utc).getTime(); // veya  data.timestamp
        const clientTime = Date.now();
        serverOffset = serverTime - clientTime;
      } catch (e) {
        serverOffset = 0;
      }
    }
    getServerOffset();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const password2 = document.getElementById('password2').value;
      if (password.length < 6) {
        msg.innerHTML = '<span class="error">Şifre en az 6 karakter olmalı.</span>';
        return;
      }
      if (password !== password2) {
        msg.innerHTML = '<span class="error">Şifreler eşleşmiyor.</span>';
        return;
      }
      submitBtn.disabled = true;
      msg.innerHTML = 'İşlem yapılıyor...';
      // (Opsiyonel) Token süresi kontrolü yapılacaksa burada offset ile kontrol edilebilir
      try {
        const res = await fetch('https://botanikakademi.com/node/users/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password })
        });
        const data = await res.json();
        if (res.ok) {
          msg.innerHTML = 'Şifreniz başarıyla güncellendi. Giriş ekranından tekrar giriş yapabilirsiniz.';
          form.classList.add('hidden');
        } else {
          msg.innerHTML = `<span class="error">${data?.error || 'Şifre sıfırlama başarısız.'}</span>`;
        }
      } catch (err) {
        msg.innerHTML = '<span class="error">Sunucuya ulaşılamadı.</span>';
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
